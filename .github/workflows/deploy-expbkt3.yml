# T3-CUSTOM(expbkt3): Isolated validation/deployment workflow for the experimental branch.
name: Validate and deploy experimental T3

on:
  push:
    branches: [expbkmain]
  pull_request:
    branches: [expbkmain]
  workflow_dispatch:

concurrency:
  group: expbkt3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime is installed
        run: pnpm exec vp run --filter @t3tools/desktop ensure:electron

      - name: Check formatting and lint
        run: pnpm exec vp check

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Test
        run: pnpm exec vp run test

      - name: Build experimental web client
        run: pnpm exec vp run --filter @t3tools/web build
        env:
          VITE_T3_EXPERIMENTAL_CONTROL_CENTER: "true"
          VITE_T3_CONDUCTOR: "true"

      - name: Build server bundle
        run: pnpm exec vp run --filter t3 build:bundle

      # T3-CUSTOM(expbkt3): The production host installs this verified artifact
      # instead of rebuilding application code on the server.
      - name: Prepare experimental deployment artifact
        run: |
          mkdir -p deployment-artifact/apps/web deployment-artifact/apps/server
          cp -a apps/web/dist deployment-artifact/apps/web/
          cp -a apps/server/dist deployment-artifact/apps/server/
          printf '%s\n' "$GITHUB_SHA" > deployment-artifact/SHA

      - name: Publish experimental deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: expbkt3-${{ github.sha }}
          path: deployment-artifact
          if-no-files-found: error
          retention-days: 7
