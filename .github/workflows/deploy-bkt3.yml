name: Validate and deploy bkt3

on:
  push:
    branches: [bkmain]
  pull_request:
    branches: [bkmain]
  workflow_dispatch:

concurrency:
  group: bkt3-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec vp check

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Build web client
        run: pnpm exec vp run --filter @t3tools/web build

      - name: Build server bundle
        run: pnpm exec vp run --filter t3 build:bundle

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/bkmain'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: bkt3-development
      url: https://bkt3.dev.beknown.live
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy bkmain on the server
        env:
          DEPLOY_HOST: ${{ secrets.BKT3_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.BKT3_DEPLOY_SSH_KEY }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_KEY" ]]; then
            echo "BKT3_DEPLOY_HOST and BKT3_DEPLOY_SSH_KEY are required." >&2
            exit 1
          fi

          install -d -m 0700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/bkt3_deploy
          chmod 0600 ~/.ssh/bkt3_deploy

          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 \
            -i ~/.ssh/bkt3_deploy "ubuntu@$DEPLOY_HOST" \
            "/home/ubuntu/repos/t3code-bkmain/deploy/bkt3/deploy.sh '$EXPECTED_SHA'"

      - name: Verify public endpoint
        run: curl --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 5 --max-time 20 -fsS https://bkt3.dev.beknown.live/ >/dev/null
