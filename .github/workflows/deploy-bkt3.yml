name: Validate and deploy bkt3

on:
  push:
    branches: [bkmain]
  pull_request:
    branches: [bkmain]
  workflow_dispatch:

concurrency:
  group: bkt3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm exec vp check

      - name: Typecheck
        run: pnpm exec vp run typecheck

      - name: Build web client
        run: pnpm exec vp run --filter @t3tools/web build

      - name: Build server bundle
        run: pnpm exec vp run --filter t3 build:bundle
